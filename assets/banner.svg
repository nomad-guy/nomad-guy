<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a20"/>
      <stop offset="0.55" stop-color="#0d1a3a"/>
      <stop offset="1" stop-color="#152a5e"/>
    </linearGradient>
    <linearGradient id="cyanbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff6ff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7ff6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ff6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4001a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4001a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c4001a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1400" height="400" fill="url(#bg)"/>

  <!-- background diagonals -->
  <polygon points="0,400 560,0 900,0 260,400" fill="#0a1430" opacity="0.9"/>
  <polygon points="1400,0 860,0 1400,330" fill="#0e1c44" opacity="0.7"/>
  <rect x="0" y="0" width="26" height="400" fill="#c4001a" opacity="0.85"/>
  <rect x="26" y="0" width="8" height="400" fill="#ff5a6a" opacity="0.7"/>

  <!-- light beams -->
  <polygon points="1400,0 1180,0 1400,300" fill="url(#cyanbeam)" opacity="0.8"/>
  <polygon points="700,0 560,0 700,120" fill="url(#cyanbeam)" opacity="0.5"/>

  <!-- moon / sun rings -->
  <g fill="none" stroke="#7ff6ff" opacity="0.28">
    <circle cx="1230" cy="90" r="150" stroke-width="2"/>
    <circle cx="1230" cy="90" r="120" stroke-width="1.5"/>
    <circle cx="1230" cy="90" r="88" stroke-width="1"/>
  </g>
  <circle cx="1230" cy="90" r="150" fill="none" stroke="#c4001a" stroke-width="10" opacity="0.85"/>

  <!-- thin grid lines lower-right -->
  <g stroke="#7ff6ff" opacity="0.08">
    <line x1="860" y1="0" x2="1400" y2="320"/>
    <line x1="980" y1="0" x2="1400" y2="230"/>
    <line x1="1100" y1="0" x2="1400" y2="140"/>
  </g>

  <!-- kicker -->
  <text x="78" y="120" fill="#8ef5ff" font-family="Courier New, monospace" font-size="20" letter-spacing="10">◆ PERSONA3 · THE WILD CARD ◆</text>

  <!-- title -->
  <text x="74" y="215" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="2">NOMAD-GUY'S</text>
  <text x="74" y="295" fill="#7ff6ff" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="14">PERSONA</text>

  <!-- divider -->
  <polygon points="78,318 420,318 405,332 78,332" fill="#c4001a"/>
  <rect x="78" y="352" width="300" height="6" fill="#7ff6ff" opacity="0.9"/>
  <rect x="390" y="352" width="60" height="6" fill="#c4001a"/>

  <!-- subtitle -->
  <text x="78" y="382" fill="#c9d6ff" font-family="Verdana, Arial, sans-serif" font-size="17" letter-spacing="2">THE ROAMER — I BUILD · I SHIP · I NEVER STAY IN ONE LANE</text>

  <!-- right stat card -->
  <g>
    <rect x="840" y="210" width="440" height="150" fill="#0a1128" opacity="0.88"/>
    <rect x="840" y="206" width="440" height="8" fill="#c4001a"/>
    <text x="862" y="246" fill="#8ef5ff" font-family="Courier New, monospace" font-size="15" letter-spacing="3">ARCANA : MAGICIAN</text>
    <text x="862" y="272" fill="#eaf6ff" font-family="Courier New, monospace" font-size="15" letter-spacing="3">ROLE&nbsp;&nbsp;: FULL-STACK DEV</text>
    <text x="862" y="298" fill="#eaf6ff" font-family="Courier New, monospace" font-size="15" letter-spacing="3">LVL&nbsp;&nbsp;&nbsp;: ∞ · ALWAYS SHIPPING</text>
    <text x="862" y="330" fill="#7ff6ff" font-family="Courier New, monospace" font-size="13" letter-spacing="2">→ noctra-music.vercel.app</text>
    <text x="862" y="350" fill="#7ff6ff" font-family="Courier New, monospace" font-size="13" letter-spacing="2">→ nomad-guy.vercel.app</text>
  </g>

  <!-- corner accent -->
  <polygon points="1352,340 1400,340 1400,400 1352,400" fill="#c4001a" opacity="0.9"/>
  <polygon points="1380,340 1400,340 1400,400 1380,400" fill="#ff5a6a" opacity="0.8"/>
</svg>
